<meta charset="utf-8">
<title>SLOPLINE Proposta Arke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: presentazione a schermo intero, una slide alla volta, barra di navigazione in basso. Le slide "Prova" contengono il prototipo vivo. Tema chiaro scelto apposta. */
:root{
  color-scheme:light;
  --bg:#f6f7f8; --surface:#ffffff; --line:#e1e5e8; --fg:#1d2a33; --muted:#66757f;
  --accent:#1f6f8b; --accent-soft:#e3f0f5;
  --ok:#2f7d4f; --ok-soft:#e3f3e9; --warn:#a86207; --warn-soft:#fdf0dc; --bad:#b4372e; --bad-soft:#fbe5e2;
  --display:"Archivo",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;display:flex;flex-direction:column}
#slide{flex:1;overflow-y:auto;padding-inline:24px;padding-block:28px 24px}
.inner{max-width:1100px;margin:0 auto}
footer{display:flex;align-items:center;gap:12px;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
footer .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:60px}
footer .track{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
footer .track div{height:100%;background:var(--accent);transition:width .25s}
footer .section{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
@media (max-width:600px){footer .section{display:none}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Slide narrative */
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.title{font:800 clamp(30px,5vw,54px)/1.08 var(--display);margin:0 0 18px;text-wrap:balance;max-width:20ch}
.sub{font-size:clamp(18px,2.2vw,23px);color:var(--muted);margin:0 0 28px;max-width:52ch}
.cover{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.cover .title{font-size:clamp(36px,6.5vw,72px)}
.hint{color:var(--muted);font-size:15px}
.file{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.file-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:10px 14px;color:#fff}
.file-head span{font-size:13px;opacity:.9}
.file-head.excel{background:#1d6f42} .file-head.pdf{background:#b4372e}
.tabs{display:flex;gap:2px;background:#f0f2f1;padding:6px 8px 0}
.tabs span{font-size:13px;padding:5px 12px;border-radius:6px 6px 0 0;color:var(--muted)}
.tabs span.on{background:#fff;color:#1d6f42;font-weight:700}
.sheet{border-collapse:collapse;width:100%;font-size:13px}
.sheet th,.sheet td{border:1px solid #d5dbd8;padding:5px 8px;text-align:left;white-space:nowrap}
.sheet th{background:#eef3f0;font-weight:700}
.sheet td.r{text-align:right;font-variant-numeric:tabular-nums}
.sheet tr.tot td{font-weight:700;background:#f6f8f7}
.sheet-h{font-size:14px;margin:14px 14px 6px;color:var(--muted)}
.file .tbl{overflow-x:auto;padding:0 14px 14px}
.pdf{max-width:720px;margin:16px auto;padding:22px 26px;box-shadow:0 2px 12px rgba(0,0,0,.12);border-radius:4px}
.pdf h3{font:800 22px var(--display);margin:0}
.pdf h4{font:700 16px var(--display);margin:16px 0 6px}
.pdf .tbl{padding:0}
.goals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.goals{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.goals{grid-template-columns:minmax(0,1fr)}}
.goals-title{max-width:none!important}
.points{display:grid;gap:12px;max-width:760px}
.points div{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 20px;font:700 clamp(20px,2.4vw,26px) var(--display)}
.issues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.issues{grid-template-columns:minmax(0,1fr)}}
.issues div{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:14px 18px;font:600 clamp(17px,1.9vw,20px)/1.3 var(--body)}
.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.dates{grid-template-columns:minmax(0,1fr)}}
.dates div{background:var(--bg);border-radius:8px;padding:6px 10px;display:grid}
.dates span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.dates b{font-size:14px;font-weight:600}
.agent{border-bottom:1px solid var(--line);padding:8px 0;display:grid;gap:4px}
.portal{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:12px}
.remind{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600}
.remind .btn{padding:6px 12px;font-size:14px}
.tb-h{font:700 17px var(--display);margin:0 0 4px}
.machines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.machines{grid-template-columns:minmax(0,1fr)}}
.machine{font:inherit;text-align:left;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;color:var(--fg)}
.machine.ok{border-color:var(--ok)} .machine.warn{border-color:var(--warn)} .machine.bad{border-color:var(--bad)}
.machine .badge{justify-self:start}
.prio{width:30px;height:30px;border-radius:50%;background:var(--fg);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.job-actions{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}
@media (max-width:600px){.job-actions{grid-template-columns:minmax(0,1fr)}}
.job-actions .big{font-size:18px;padding:14px}
.calc{background:var(--bg);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px 16px;align-items:start}
.calc>.form,.calc>.tbl,.calc>.btn.light{grid-column:1}
.calc>.calc-sum,.calc>.note,.calc>[data-a="calc-crea"]{grid-column:2}
.calc>.calc-sum{grid-row:1/span 3}
@media (max-width:800px){.calc{grid-template-columns:minmax(0,1fr)}.calc>*{grid-column:1!important;grid-row:auto!important}}
.calc-t select{min-width:230px}
.calc-t select,.calc-t input{font-size:14px;padding:5px 6px}
.calc-t td{vertical-align:middle;background:#fff}
.x{border:0;background:var(--bad-soft);color:var(--bad);border-radius:6px;width:28px;height:28px;font-weight:800;cursor:pointer}
.calc-sum{display:grid;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.calc-sum div{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.calc-sum .tot{font-size:19px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.calc-sum .tot b{color:var(--accent)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:4px}
.mail{display:grid;gap:2px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.mail b{color:var(--accent)}
.mag-t td{vertical-align:middle}
.calc2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:800px){.calc2{grid-template-columns:minmax(0,1fr)}}
.calc-left{display:grid;gap:8px;align-content:start}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 32px;gap:8px;align-items:center}
.calc-right{background:var(--accent-soft);border-radius:12px;padding:16px;display:grid;gap:6px;align-content:center}
.calc-tot{font:800 40px var(--display);color:var(--accent);line-height:1.1}
.calc-right .btn{margin-top:6px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.cols3{grid-template-columns:minmax(0,1fr)}}
.simple{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px}
.simple:last-child{border-bottom:0}
.simple>div{display:grid}
.simple.col{display:grid;justify-content:stretch}
.simple .btn{justify-self:start}
.sec{font:700 19px var(--display);margin:0 0 10px}
.agent-card{display:grid;gap:10px;align-content:start}
.agent-name{font:700 18px var(--display)}
.agent-kpi{display:grid;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.agent-kpi b{font:800 28px var(--display);color:var(--accent)}
.agent-clients .line{padding:7px 0}
.calc-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border-radius:10px;padding:12px;margin-top:4px}
.calc-foot>div{display:grid}
.calc-foot .calc-tot{font-size:30px}
.agent-mini{display:grid;gap:4px}
.agent-val{font:800 26px var(--display);color:var(--accent)}
.cli-t td{vertical-align:middle;white-space:normal}
.cli-t td:first-child{white-space:nowrap}
.manca{font-weight:700;font-size:14px}
.manca.ok{color:var(--ok)} .manca.warn{color:var(--warn)} .manca.bad{color:var(--bad)}
.mini-bar{height:6px;background:var(--bg);border-radius:3px;margin-top:4px;overflow:hidden;max-width:220px}
.mini-bar div{height:100%;background:var(--accent)}
.todo li.done{color:var(--muted);text-decoration:line-through}
.todo li.next{font-weight:700;color:var(--fg)}
.todo li.next::marker{color:var(--accent)}
.flash{outline:3px solid var(--warn);outline-offset:3px;border-radius:10px;animation:flash 1.6s ease-out 1}
@keyframes flash{0%{outline-color:var(--warn);box-shadow:0 0 0 8px var(--warn-soft)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.points p{margin:0}
.points small{display:block;font:400 clamp(15px,1.6vw,17px)/1.35 var(--body);color:var(--muted);margin-top:2px}
.points span{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start}
.goal b{font:700 18px/1.25 var(--display)}
.goal p{margin:0;font-size:15px}
.goal .now{color:var(--fg)}
.goal .money{color:var(--ok);font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.goal .money::before{content:"↗ "}
.cover2{min-height:72vh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:40px;align-items:center}
@media (max-width:800px){.cover2{grid-template-columns:minmax(0,1fr)}}
.cover2 .title{font-size:clamp(34px,5.2vw,62px);max-width:16ch}
.logos{display:flex;align-items:center;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.lg-arke{height:40px;width:auto}
.lg-slp{height:62px;width:auto}
.lx{font:700 30px var(--display);color:var(--muted)}
.cover-img{margin:0;display:grid;gap:6px}
.cover-img img{width:100%;max-height:68vh;object-fit:cover;border-radius:18px;display:block}
.cover-img figcaption{font-size:12px;color:var(--muted);text-align:right}
.big-quote{font:700 clamp(24px,3.4vw,38px)/1.25 var(--display);margin:0 0 14px;max-width:28ch;text-wrap:balance}
.big-quote::before{content:"“"} .big-quote::after{content:"”"}
.cite{color:var(--muted);font-size:17px;margin:0 0 30px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px;align-content:start}
.tile b{font:700 20px var(--display)}
.tile p{margin:0;color:var(--muted)}
.tile .k{font:800 40px var(--display);color:var(--accent);line-height:1}
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:860px){.chain{grid-template-columns:minmax(0,1fr)}}
.link{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.link b{font:700 18px var(--display)}
.link .yes{color:var(--ok);font-size:15px} .link .no{color:var(--bad);font-size:15px}
.link .yes::before{content:"Vede: ";font-weight:700} .link .no::before{content:"Non vede: ";font-weight:700}
.banner{margin-top:22px;background:var(--accent);color:#fff;border-radius:14px;padding:18px 22px;font:700 clamp(18px,2.2vw,24px) var(--display)}
.rows{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;align-items:center}
@media (max-width:700px){.row2{grid-template-columns:minmax(0,1fr)}}
.row2 .pain{color:var(--bad);font-weight:600}
.row2 .fix{font-weight:600}
.row2 .fix::before{content:"→ ";color:var(--ok)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 24px}
.flow span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600}
.flow i{font-style:normal;color:var(--muted)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.plan .tile .when{font-size:14px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.plan ul,.open ul{margin:0;padding-left:20px;display:grid;gap:4px}
.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.ask{display:grid;gap:12px;counter-reset:a;max-width:760px}
.ask div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px 14px 58px;position:relative;font-size:19px;font-weight:600}
.ask div::before{counter-increment:a;content:counter(a);position:absolute;left:16px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.label-est{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:999px;vertical-align:middle}

/* Prova dal vivo */
.try-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.try-head .title{font-size:clamp(26px,3.6vw,38px);margin:0}
.todo{background:var(--accent-soft);border-radius:12px;padding:12px 16px;max-width:460px}
.todo b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.todo ol{margin:0;padding-left:20px}
.demo{border:2px dashed var(--line);border-radius:16px;padding:18px;background:var(--bg)}
.demo h1{font:800 24px var(--display);margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 14px;font-size:17px}
.today{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 18px;color:var(--muted)}
.today b{color:var(--fg)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.box h2{font:700 19px var(--display);margin:0 0 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.gap{margin-top:16px}
.list{display:grid;gap:12px}
.item{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.item-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.item-top strong{font-size:18px}
.small{color:var(--muted);font-size:15px}
.badge{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)}
.btn{font:700 15px var(--body);border:0;background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer;justify-self:start}
.btn.light{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-weight:700}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.progress i{font-style:normal;flex:1;min-width:70px;text-align:center;font-size:13px;padding:5px 4px;border-radius:6px;background:var(--bg);color:var(--muted)}
.progress i.done{background:var(--accent-soft);color:var(--accent);font-weight:600}
.progress i.now{background:var(--accent);color:#fff;font-weight:700}
.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px}
.number{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.number b{display:block;font:800 40px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.number span{color:var(--muted)}
.number.warn b{color:var(--warn)} .number.bad b{color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
label{display:grid;gap:4px;font-size:15px;font-weight:600;color:var(--muted)}
input,select{font:17px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);min-width:0;width:100%}
.line{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:6px}
.note{color:var(--muted);font-size:14px;margin:10px 0 0}
.tablet{max-width:760px;margin:0 auto;background:#26333b;border-radius:28px;padding:18px}
.tablet-screen{background:var(--surface);border-radius:14px;padding:18px;display:grid;gap:14px}
.tablet-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.tablet-head b{font:800 22px var(--display)}
.job{border:2px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.job strong{font-size:22px}
.job .what{font-size:19px}
.big{font:800 22px var(--body);border:0;border-radius:12px;padding:18px;cursor:pointer;width:100%;background:var(--ok);color:#fff}
.big.alt{background:var(--warn-soft);color:var(--warn);font-size:18px;padding:12px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:5}
@media (prefers-reduced-motion:reduce){footer .track div{transition:none}}
</style>

<main id="slide"></main>
<footer>
  <button class="btn light" id="prev" aria-label="Slide precedente">←</button>
  <button class="btn" id="next" aria-label="Avanti">Avanti →</button>
  <button class="btn light" id="skip" aria-label="Vai alla slide successiva senza la demo" hidden>Salta alla slide ⏭</button>
  <span class="count" id="count"></span>
  <div class="track"><div id="track"></div></div>
  <span class="section" id="section"></span>
</footer>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= Dati e logica del prototipo (esempio) ================= */
const OGGI = new Date('2026-10-03');
const STATI = {
  ricevuto:{n:'Nuovo ordine',fase:0}, grafica:{n:'In grafica',fase:1}, cliente:{n:'Aspetta il cliente',fase:1},
  materiali:{n:'Manca materiale',fase:2}, approvato:{n:'Pronto per la stampa',fase:2},
  stampa:{n:'In stampa',fase:3}, calandra:{n:'In calandra',fase:3}, assemblaggio:{n:'Da assemblatore esterno',fase:3},
  pronto:{n:'Pronto',fase:4}, spedito:{n:'Spedito',fase:5}
};
const FASI = ['Ordine','Grafica','Approvato','Produzione','Pronto','Spedito'];

    return `<button class="machine ${st.c}" data-a="macchina" data-m="${m.id}"><b>${m.nome}</b><span class="badge ${st.c}">${st.n}</span><span class="small">${m.stato==='attiva'&&su?'Sta lavorando: '+su.cliente:m.stato==='attiva'?'Libera':'Tocca per cambiare stato'}</span></button>`;}).join('')}</div></div>
  <div><h3 class="tb-h">Ordini di oggi, per priorità</h3>
  <div class="list">${oggi.map((o,i)=>`<div class="job">
    <div class="item-top"><span class="prio">${i+1}</span><strong>${o.cliente}</strong>${badge(o)}${inRitardo(o)?'<span class="badge bad">In ritardo</span>':''}</div>
    <div class="what">${righe(o)} · consegna promessa ${data(o.promessa)}</div>
    <div class="job-actions">
      ${o.stato==='approvato'?`<button class="big" data-a="vai" data-n="${o.n}" data-to="stampa">▶ Avvia produzione</button>`:`<button class="big" data-a="vai" data-n="${o.n}" data-to="${PROSSIMO[o.stato]}">✓ Conferma: ${FATTO[o.stato].toLowerCase()}</button>`}

V.direzione=()=>{
  const ap=aperti();
  const perFase=FASI.map((f,i)=>({f,n:ordini.filter(o=>STATI[o.stato].fase===i).length}));
  const max=Math.max(1,...perFase.map(x=>x.n));
  const nonBasta=MAGAZZINO.filter(m=>m.qta<impegnato(m.id)).length;
  return `
${intro('Direzione','Lo stato generale di tutto, in una pagina. Dal telefono, anche in giro per il reparto.','Non ho file: guardo se macchine e persone sono ferme.')}
<div class="numbers">
  <div class="number"><b>${ap.length}</b><span>ordini aperti</span></div>
  <div class="number bad"><b>${ap.filter(inRitardo).length}</b><span>in ritardo</span></div>
  <div class="number warn"><b>${ap.filter(o=>['cliente','materiali'].includes(o.stato)).length}</b><span>fermi (cliente o materiale)</span></div>
  <div class="number"><b>${euro(ap.reduce((s,o)=>s+valore(o),0))}</b><span>valore ordini aperti</span></div>
</div>
<div class="cols">
  <div class="box"><h2>Ordini per fase</h2>
    ${perFase.map(x=>`<div style="display:grid;grid-template-columns:100px minmax(0,1fr) 28px;gap:10px;align-items:center;margin-bottom:10px"><span>${x.f}</span><div class="bar"><div style="width:${x.n/max*100}%"></div></div><b>${x.n}</b></div>`).join('')}</div>
  <div class="box"><h2>In sintesi</h2>
    <div class="line"><span>Macchine in funzione</span><b>${MACCHINE.filter(m=>m.stato==='attiva').length} su ${MACCHINE.length}</b></div>
    <div class="line"><span>Materiali che non bastano per gli ordini</span><b style="color:${nonBasta?'var(--bad)':'var(--ok)'}">${nonBasta}</b></div>
    <div class="line"><span>Richieste aperte al magazzino</span><b>${richieste.filter(r=>r.stato==='inviata').length}</b></div>
    <div class="line"><span>Preventivi in attesa di risposta</span><b>${preventivi.filter(p=>!p.accettato).length}</b></div>
  </div>
</div>
<div class="box gap">
  <div class="line" style="border:0;padding-top:0"><h2 style="margin:0">Report per la direzione</h2>
    <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="report" data-r="excel">📊 Scarica Excel</button><button class="btn light" data-a="report" data-r="pdf">📄 Scarica PDF</button></span></div>
  <p class="small" style="margin:4px 0 0">Si genera da solo con i dati segnati dai reparti: cosa si produce ora e per chi, storico ordini, valore per canale.</p>
  ${report?reportView():''}
</div>`;};
V.magazzino=()=>{
  const nb=MAGAZZINO.filter(m=>m.qta<impegnato(m.id)).length;
  const sotto=MAGAZZINO.filter(m=>m.qta>=impegnato(m.id)&&m.qta<m.scorta).length;
  return `
${intro('Magazzino','Pagina condivisa da grafica e produzione: cosa c\'è, cosa serve agli ordini, cosa manca.','Non si sa cosa c\'è, cosa serve e cosa manca.')}
<div class="numbers">
  <div class="number"><b>${MAGAZZINO.length-nb-sotto}</b><span>materiali a posto</span></div>
  <div class="number warn"><b>${sotto}</b><span>sotto la scorta minima</span></div>
  <div class="number bad"><b>${nb}</b><span>non bastano per gli ordini</span></div>
  <div class="number"><b>${richieste.filter(r=>r.stato==='inviata').length}</b><span>richieste da preparare</span></div>
</div>
<div class="box"><h2>Materiali</h2>
  <div class="tbl"><table class="sheet mag-t"><tr><th>Codice</th><th>Materiale</th><th>Dove</th><th>Disponibile</th><th>Serve agli ordini</th><th>Manca</th><th>Scorta minima</th><th>Stato</th></tr>
  ${MAGAZZINO.map((m,i)=>{const imp=impegnato(m.id);const manca=Math.max(0,imp-m.qta);
    const st=manca?'<span class="badge bad">Non basta</span>':m.qta<m.scorta?'<span class="badge warn">Da riordinare</span>':'<span class="badge ok">A posto</span>';
    return `<tr><td><span class="code">${m.cod}</span></td><td>${m.nome}</td><td>${m.pos}</td><td><input data-mag="${i}" type="number" value="${m.qta}" style="width:80px" aria-label="Disponibile ${m.nome}"></td><td class="r">${imp}</td><td class="r" style="color:${manca?'var(--bad)':'inherit'};font-weight:${manca?700:400}">${manca||'—'}</td><td class="r">${m.scorta}</td><td>${st}</td></tr>`;}).join('')}
  </table></div>
  <p class="note">La disponibilità si aggiorna quando entra o esce materiale.</p>
</div>
<div class="box gap"><h2>Richieste da grafica e produzione</h2>
  ${richieste.length?`<div class="list">${richieste.map(r=>`<div class="item">
    <div class="item-top"><strong>Ordine n. ${r.n} · ${r.cliente}</strong><span class="small">da ${r.da}</span>${r.stato==='evasa'?'<span class="badge ok">Preparata</span>':'<span class="badge warn">Da preparare</span>'}</div>
    <div class="small">${r.items.map(x=>`${x.q} × <span class="code">${mag(x.m).cod}</span> ${mag(x.m).nome}${x.manca?` <b style="color:var(--bad)">(mancano ${x.manca})</b>`:''}`).join(' · ')}</div>
    <div class="mail"><b>✉️ Email inviata al magazzino dall'agente AI</b><span>${r.testo}</span></div>
    ${r.stato==='inviata'?`<button class="btn light" data-a="evadi" data-i="${r.id}">Segna come preparata</button>`:''}
  </div>`).join('')}</div>`:'<p class="small">Nessuna richiesta. Grafica e produzione la inviano con un clic dall\'ordine.</p>'}
</div>`;};
let report=null;
const valore = o => o.righe.reduce((s,r)=>s+r.q*prod(r.p).prezzo,0);
const euro = n => '€ '+n.toLocaleString('it-IT');
function reportView(){
  const inProd=ordini.filter(o=>STATI[o.stato].fase===3);
  const canali={}; ordini.forEach(o=>{const c=canali[o.canale]??={ordini:0,pezzi:0,valore:0};c.ordini++;c.pezzi+=pezzi(o);c.valore+=valore(o);});
  const tot=ordini.reduce((s,o)=>s+valore(o),0);
  const nome = report==='excel'?'Report_SLOPLINE_ottobre.xlsx':'Report_SLOPLINE_3-ottobre.pdf';
  const head = `<div class="file-head ${report}"><b>${report==='excel'?'📊':'📄'} ${nome}</b><span>Anteprima del file · nella versione reale si scarica con un clic</span></div>`;
  const tabOrdini = `<table class="sheet"><tr><th>Ordine</th><th>Cliente</th><th>Canale</th><th>Agente</th><th>Prodotti</th><th>Pezzi</th><th>Valore</th><th>Stato</th><th>Consegna promessa</th></tr>
    ${ordini.map(o=>`<tr><td>${o.n}</td><td>${o.cliente}</td><td>${o.canale}</td><td>${o.agente}</td><td>${righe(o)}</td><td class="r">${pezzi(o)}</td><td class="r">${euro(valore(o))}</td><td>${STATI[o.stato].n}</td><td>${data(o.promessa)}</td></tr>`).join('')}</table>`;
  const tabCanali = `<table class="sheet"><tr><th>Canale</th><th>Ordini</th><th>Pezzi</th><th>Valore</th></tr>
    ${Object.entries(canali).map(([c,v])=>`<tr><td>${c}</td><td class="r">${v.ordini}</td><td class="r">${v.pezzi}</td><td class="r">${euro(v.valore)}</td></tr>`).join('')}
    <tr class="tot"><td>Totale</td><td class="r">${ordini.length}</td><td class="r">${ordini.reduce((s,o)=>s+pezzi(o),0)}</td><td class="r">${euro(tot)}</td></tr></table>`;
  if(report==='excel') return `<div class="file">${head}
    <div class="tabs"><span class="on">Ordini</span><span>Valore per canale</span><span>Magazzino</span></div>
    <div class="tbl">${tabOrdini}</div><h3 class="sheet-h">Foglio "Valore per canale"</h3><div class="tbl">${tabCanali}</div></div>`;
  return `<div class="file">${head}<div class="pdf">
    <h3>Report direzione · 3 ottobre 2026</h3>
    <p class="small">SLOPLINE · generato dallo strumento ordini · dati di esempio</p>
    <div class="numbers" style="margin:12px 0">
      <div class="number"><b>${aperti().length}</b><span>ordini aperti</span></div>
      <div class="number"><b>${inProd.reduce((s,o)=>s+pezzi(o),0)}</b><span>pezzi in produzione ora</span></div>
      <div class="number"><b>${euro(tot)}</b><span>valore ordini nel periodo</span></div>
    </div>
    <h4>In produzione ora: cosa e per chi</h4>
    ${inProd.map(o=>`<div class="line"><span><b>${o.cliente}</b> · ${righe(o)}</span><span>${STATI[o.stato].n}</span></div>`).join('')||'<p class="small">Niente in produzione.</p>'}
    <h4>Valore per canale</h4><div class="tbl">${tabCanali}</div>
  </div></div>`;
}

 {sez:'Dalle interviste',html:()=>`
   <p class="eyebrow">Dalle interviste a direzione, commerciale, ufficio ordini, grafica e produzione</p>
   <h2 class="title goals-title">Quattro problemi su cui possiamo intervenire subito.</h2>
   <div class="points">
     <div><span>1</span><p>Ordini dispersi e ricopiati a mano<small>Arrivano da email, WhatsApp, telefono e Shopify, ognuno in un formato diverso.</small></p></div>
     <div><span>2</span><p>Nessuno vede a che punto è un ordine<small>Per rispondere al cliente si chiama in ufficio o si va in reparto.</small></p></div>
     <div><span>3</span><p>Magazzino e produzione senza visibilità<small>A volte si parte senza materiale, e non si sa quanto lavoro sta arrivando.</small></p></div>
     <div><span>4</span><p>Dati e clienti non registrati<small>Listino su un Excel modificabile da tutti, clienti degli agenti e storico ordini assenti.</small></p></div>
   </div>`},

 {sez:'Obiettivi',html:()=>`
   <p class="eyebrow">I nostri obiettivi</p>
   <h2 class="title goals-title">Cosa miglioriamo.</h2>
   <div class="points">
     <div><span>1</span><p>Ordini inseriti una volta sola<small>Email, WhatsApp e Shopify diventano una scheda pronta, senza ricopiare.</small></p></div>
     <div><span>2</span><p>Stato dell'ordine sempre visibile<small>Chiunque risponde al cliente in pochi secondi, senza telefonate tra reparti.</small></p></div>
     <div><span>3</span><p>Mai più partire senza materiale<small>Il magazzino si controlla prima della stampa, non quando si è già in macchina.</small></p></div>
     <div><span>4</span><p>I clienti restano all'azienda<small>Ogni cliente degli agenti viene registrato con preventivi e ordini.</small></p></div>
     <div><span>5</span><p>Ogni ordine tracciato dall'inizio alla fine<small>Storico, produzione e valore sempre a portata di mano, anche in Excel o PDF.</small></p></div>
   </div>
   <p class="sub gap">Meno tempo perso, più ordini evasi, clienti che tornano.</p>`},

 {sez:'La soluzione',html:()=>`
   <p class="eyebrow">La soluzione</p>
   <h2 class="title">Una scheda per ogni ordine, dall'ordine alla spedizione.</h2>
   <p class="sub">Un assistente legge email, audio WhatsApp e file Shopify e prepara la scheda: l'ufficio controlla e conferma. Poi ogni reparto la aggiorna con un clic, e il magazzino viene controllato prima di partire.</p>
   <div class="flow"><span>Ordine dall'agente o dal commerciale</span><i>→</i><span>Ufficio ordini</span><i>→</i><span>Grafica e approvazione</span><i>→</i><span>Controllo materiale</span><i>→</i><span>Produzione</span><i>→</i><span>Spedizione</span></div>
   <p class="hint">Ora lo proviamo, reparto per reparto. I dati sono di esempio.</p>
   `},

 {sez:'Come si usa',html:()=>`
   <p class="eyebrow">Come si usa</p>
   <h2 class="title">Ognuno con lo strumento che ha già in mano.</h2>
   <div class="tiles">
     <div class="tile"><b>Direzione</b><p>Telefono, anche mentre gira per il reparto.</p></div>
     <div class="tile"><b>Commerciale e agenti</b><p>Computer o telefono, anche fuori sede.</p></div>
     <div class="tile"><b>Ufficio ordini e Grafica</b><p>Il computer che usano già.</p></div>
     <div class="tile"><b>Produzione</b><p>Un tablet fisso in reparto con pulsanti grandi. Gli ordini arrivano lì, senza fogli di carta.</p></div>
     <div class="tile"><b>Magazzino</b><p>Una pagina condivisa da grafica e produzione. Le richieste arrivano in piattaforma e per email.</p></div>
   </div>
   <div class="rows gap">
     <div class="row2"><span class="pain">WhatsApp, email, Danea e Shopify</span><span class="fix">Restano. Un agente AI li collega alla piattaforma: legge i messaggi, prepara gli ordini e tiene i dati allineati.</span></div>
   </div>`},

 {sez:'Punti aperti',html:()=>`
   <p class="eyebrow">Cosa non sappiamo ancora</p>
   <h2 class="title">Alcune cose vanno misurate prima di decidere.</h2>
   <div class="open">
     <div class="tile"><b>Numeri da misurare</b><ul>
       <li>In quale fase si perdono i giorni</li>
       <li>Quanti ordini sono davvero in ritardo</li>
       <li>Quanti ordini si fermano per materiale</li>
       <li>Quanto costa il problema in clienti e fatturato</li></ul></div>
     <div class="tile"><b>Da approfondire</b><ul>
       <li>Come lavora oggi il magazzino e chi lo segue</li>
       <li>Cosa succede dopo la calandra e all'assemblaggio esterno</li>
       <li>Definire la procedura: da chi arriva l'ordine e a chi passa, dal commerciale all'ufficio ordini alla grafica</li>
       <li>Capacità reale delle macchine</li></ul></div>
   </div>
   <p class="sub gap">Lo strumento registra da solo quando ogni ordine cambia fase: nel pilota questi numeri arrivano senza lavoro in più.</p>`},

/* ================= Navigazione ================= */
let cur=0;
const slideEl=document.getElementById('slide');
function render(keepScroll){
  const s=SLIDES[cur]; const top=slideEl.scrollTop;
  slideEl.innerHTML=`<div class="inner">${s.html()}</div>`;
  document.getElementById('count').textContent=`${cur+1} / ${SLIDES.length}`;
  document.getElementById('track').style.width=`${(cur+1)/SLIDES.length*100}%`;
  document.getElementById('section').textContent=s.sez;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===SLIDES.length-1;
  document.getElementById('skip').hidden=!inSospeso();
  document.getElementById('next').textContent=inSospeso()?'Prossimo passo →':'Avanti →';
  slideEl.scrollTop=keepScroll?top:0;
}
function go(n){cur=Math.max(0,Math.min(SLIDES.length-1,n));render(false);}
/* ---------- Demo automatica: ogni Avanti esegue il passo successivo ---------- */
const $s = sel => slideEl.querySelector(sel);
const inside = (txt, sel, scope) => { const box=[...slideEl.querySelectorAll(scope)].find(e=>e.textContent.includes(txt)); return box && (sel?box.querySelector(sel):box); };
const press = el => { if(el) el.click(); };
const setv = (el,v) => { if(el){ el.value=v; el.dispatchEvent(new Event('change',{bubbles:true})); } };
const riga = txt => [...slideEl.querySelectorAll('tr')].find(r=>r.textContent.includes(txt));
const fatti = {};
function assicuraCicloValle(){const p=preventivi.find(x=>x.n==311);if(p&&!p.accettato){const n=nextOrd++;ordini.unshift(ordine(n,p.cliente,p.agente,p.canale,p.righe,'ricevuto',[['ricevuto',oggiStr]]));p.accettato=true;}}

  commerciale:[
    {t:'Arriva l\'ordine di Ciclo Valle da Agente Nord: lo inviamo all\'ufficio ordini', run:()=>press($s('[data-a="accetta"]')), hl:()=>inside('Ciclo Valle',null,'.simple')},
    {t:'Nella lista clienti Ciclo Valle compare come "Nuovo ordine", con quanto manca', hl:()=>riga('Ciclo Valle')},
    {t:'Team Pedale Rosso è in calandra: si sa subito quanto manca alla spedizione', hl:()=>riga('Team Pedale Rosso')}
  ],
  ordini:[
    {t:'Email del commerciale: l\'assistente la legge e prepara la scheda', run:()=>press(inside('Email','[data-a="leggi"]','.item')), hl:()=>inside('Email',null,'.item')},
    {t:'Controllata: diventa un ordine con un clic', run:()=>press($s('[data-a="conferma"]')), hl:()=>inside('Email',null,'.item')},
    {t:'Audio WhatsApp: l\'assistente segnala un dubbio sulla quantità', run:()=>press(inside('Audio WhatsApp','[data-a="leggi"]','.item')), hl:()=>inside('Audio WhatsApp',null,'.item')},
    {t:'Correggiamo a 22 pezzi e confermiamo', run:()=>{setv($s('[data-q]'),22);press($s('[data-a="conferma"]'));}, hl:()=>inside('Audio WhatsApp',null,'.item')}
  ],
  grafica:[
    {t:'L\'ordine di Ciclo Valle è già in grafica: si comincia', run:()=>{assicuraCicloValle();render(true);press(inside('Ciclo Valle','[data-to="grafica"]','.item'));}, hl:()=>inside('Ciclo Valle',null,'.item')},
    {t:'Bozzetto inviato al cliente', run:()=>press(inside('Ciclo Valle','[data-to="cliente"]','.item')), hl:()=>inside('Ciclo Valle',null,'.item')},
    {t:'GS Montagna Bike non risponde da settimane: parte il reminder email automatico', run:()=>press(inside('GS Montagna Bike','[data-a="reminder"]','.item')), hl:()=>inside('GS Montagna Bike',null,'.item')},
    {t:'Ciclo Valle approva: manca il tessuto, l\'ordine si blocca prima della stampa', run:()=>press(inside('Ciclo Valle','[data-a="approva"]','.item')), hl:()=>inside('Ciclo Valle',null,'.item')},
    {t:'Un clic: l\'agente AI chiede il materiale al magazzino', run:()=>press(inside('Ciclo Valle','[data-a="materiale"]','.item')), hl:()=>inside('Ciclo Valle',null,'.item')}
  ],
  produzione:[
    {t:'L\'operaio segna la stampante pellicola come in funzione', run:()=>{MACCHINE.find(m=>m.id==='pellicola').stato='attiva';toast('Stampante pellicola loghi: in funzione');}, hl:()=>$s('[data-m="pellicola"]')},
    {t:'Ordine n. 1 per priorità: fase completata con un tocco', run:()=>press($s('.job [data-a="vai"]')), hl:()=>$s('.job')},
    {t:'Serve altro materiale: richiesta al magazzino con un tocco', run:()=>press($s('.job [data-a="materiale"]')), hl:()=>$s('.job')}
  ],
  magazzino:[
    {t:'Le richieste di grafica e produzione arrivano qui e per email', hl:()=>$s('.mail')&&$s('.mail').closest('.item')},
    {t:'Arriva il tessuto salopette (200): Ciclo Club Lago si sblocca da solo', run:()=>setv($s('[data-mag="2"]'),200), hl:()=>riga('TES-SA')},
    {t:'Il magazzino segna la richiesta come preparata', run:()=>press($s('[data-a="evadi"]')), hl:()=>$s('.list .item')}
  ],
  direzione:[
    {t:'Lo stato generale: ordini aperti, in ritardo, fermi e valore', hl:()=>$s('.demo .numbers')},
    {t:'Report Excel con tutti gli ordini, pronto da scaricare', run:()=>press($s('[data-r="excel"]')), hl:()=>$s('.file')},
    {t:'Oppure il report PDF di una pagina', run:()=>press($s('[data-r="pdf"]')), hl:()=>$s('.file')}
  ]
};
function inSospeso(){const k=SLIDES[cur].demo;return k&&SCRIPT[k]&&(fatti[k]||0)<SCRIPT[k].length;}
function avanti(){
  if(!inSospeso()){go(cur+1);return;}
  const k=SLIDES[cur].demo, st=SCRIPT[k][fatti[k]||0];
  fatti[k]=(fatti[k]||0)+1;
  if(st.run) st.run(); else toast(st.t);
  render(true);
  const el=st.hl&&st.hl();
  if(el){el.classList.add('flash');el.scrollIntoView({block:'center',behavior:'smooth'});}
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>avanti();
document.getElementById('skip').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.key==='ArrowRight'){e.preventDefault();avanti();}
  if(['ArrowDown','PageDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200);}

slideEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const o=ordini.find(x=>x.n==b.dataset.n);
  switch(b.dataset.a){
    case 'accetta':{const p=preventivi.find(x=>x.n==b.dataset.n);const n=nextOrd++;ordini.unshift(ordine(n,p.cliente,p.agente,p.canale,p.righe,'ricevuto',[['ricevuto',oggiStr]]));p.accettato=true;toast(`Ordine di ${p.cliente} inviato all'ufficio ordini: lo vedono anche grafica e produzione`);break;}
    case 'vai':vai(o,b.dataset.to);if(b.dataset.to==='calandra')servono(o).forEach(x=>mag(x.m).qta-=x.q);toast(`${o.cliente}: ${STATI[b.dataset.to].n}`);break;
    case 'approva':if(mancano(o).length){vai(o,'materiali');toast(`Attenzione: per ${o.cliente} manca materiale. Bloccato prima della stampa.`);}else{vai(o,'approvato');toast(`${o.cliente} approvato. Il materiale c'è.`);}break;
    case 'ricontrolla':if(mancano(o).length)toast('Il materiale non basta ancora: controlla la pagina Magazzino');else{vai(o,'approvato');toast(`${o.cliente} sbloccato: pronto per la stampa`);}break;
    case 'materiale':richiedi(o,b.dataset.da||'Produzione');toast(`L'agente AI ha inviato la richiesta al magazzino per l'ordine n. ${o.n}`);break;
    case 'evadi':richieste.find(r=>r.id==b.dataset.i).stato='evasa';toast('Richiesta segnata come preparata');break;
    case 'spedisci':vai(o,'spedito');toast(`${o.cliente}: spedito`);break;
    case 'report':report=report===b.dataset.r?null:b.dataset.r;if(report)toast(report==='excel'?'File Excel pronto: ecco l\'anteprima':'Report PDF pronto: ecco l\'anteprima');break;
    case 'portale':{const ag=document.getElementById('pa-ag').value;const c=document.getElementById('pa-cli').value.trim();if(c)portale[ag].extra.push(c);portale[ag].agg=oggiStr;toast(`${ag}: lista clienti aggiornata`);break;}
    case 'macchina':{const m=MACCHINE.find(x=>x.id===b.dataset.m);m.stato=CICLO[m.stato];toast(`${m.nome}: ${STATO_M[m.stato].n.toLowerCase()}`);break;}
    case 'portale-agg':{const ag=b.dataset.ag;portale[ag].extra.push('Bike Team Pianura');portale[ag].agg=oggiStr;toast(`${ag}: lista clienti aggiornata dal portale`);break;}
    case 'calc-add':calc.righe.push({p:'gil',q:10});break;
    case 'calc-del':calc.righe.splice(+b.dataset.i,1);break;
    case 'calc-crea':{const n=nextOrd++;ordini.unshift(ordine(n,calc.cliente||'Nuovo cliente',calc.agente,'Squadra',calc.righe.map(r=>({...r})),'ricevuto',[['ricevuto',oggiStr]]));toast(`Ordine per ${calc.cliente} inviato all'ufficio ordini: lo vedono anche grafica e produzione`);break;}
    case 'reminder':o.reminder=true;toast(`Email di promemoria inviata a ${o.cliente}`);break;
    case 'leggi':arrivi.find(a=>a.id==b.dataset.i).stato='letto';toast('L\'assistente ha preparato la scheda: controllala');break;
    case 'conferma':{const a=arrivi.find(x=>x.id==b.dataset.i);const n=nextOrd++;ordini.unshift(ordine(n,a.cliente,a.agente,a.canale,a.righe,'ricevuto',[['ricevuto',oggiStr]]));a.stato='fatto';toast(`Ordine creato per ${a.cliente}: lo vedono già Grafica e Commerciale`);break;}
    case 'manuale':manuale=true;break;
    case 'manuale-ok':{const n=nextOrd++;ordini.unshift(ordine(n,document.getElementById('m-cli').value.trim()||'Nuovo cliente','Capo commerciale','Squadra',[{p:document.getElementById('m-prod').value,q:+document.getElementById('m-q').value||1}],'ricevuto',[['ricevuto',oggiStr]]));manuale=false;toast('Ordine inserito a mano');break;}
  }
  render(true);
});
slideEl.addEventListener('input',e=>{if(e.target.id==='cerca'){cerca=e.target.value;render(true);const c=document.getElementById('cerca');c.focus();c.setSelectionRange(c.value.length,c.value.length);}});
slideEl.addEventListener('change',e=>{
  if(e.target.dataset.cr!==undefined){const r=calc.righe[+e.target.dataset.cr];r[e.target.dataset.cf]=e.target.dataset.cf==='q'?Math.max(1,+e.target.value||1):e.target.value;render(true);return;}
  if(e.target.dataset.cc){calc[e.target.dataset.cc]=e.target.value;return;}
  if(e.target.dataset.q){arrivi.find(a=>a.id==e.target.dataset.q).righe[+e.target.dataset.j].q=+e.target.value||1;return;}if(e.target.dataset.mag){MAGAZZINO[+e.target.dataset.mag].qta=+e.target.value;
    const sbloccati=ordini.filter(o=>o.stato==='materiali'&&!mancano(o).length);sbloccati.forEach(o=>vai(o,'approvato'));
    render(true);toast(sbloccati.length?`Magazzino aggiornato: ${sbloccati.map(o=>o.cliente).join(', ')} sbloccato, pronto per la stampa`:'Magazzino aggiornato');}});
render(false);
</script>
